version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: protocol_health_db
    environment:
      POSTGRES_DB: protocol_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: protocol_health_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/protocol_health
      FLASK_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: protocol_health
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./ingest:/app/ingest
      - ./config:/app/config
      - ./risk:/app/risk
      - ./tools:/app/tools
      - ./db:/app/db

  dashboard:
    image: nginx:alpine
    container_name: protocol_health_dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
