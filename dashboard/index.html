                                            <span style={{marginLeft:'8px',padding:'2px 6px',fontSize:'10px',background:'rgba(170,0,255,0.1)',color:'var(--accent-purple)',border:'1px solid var(--accent-purple)',letterSpacing:'0.5px'}}>STRUCTURAL</span>
                                        </div>
                                    </div>
                                    <div className="metric-card">
                                        <div className="metric-label">Data Coverage</div>
                                        <div className="metric-cell-value" style={{color: coverageColor(current.coverage_pct)}}>{current.coverage_pct !== null && current.coverage_pct !== undefined ? `${(current.coverage_pct * 100).toFixed(0)}%` : <NaValue note="Coverage data not computed" />}</div>
                                        <div className="metric-cell-sub">Pool count: {latestMetrics.pool_count_80 ?? 'N/A'} (structural)</div>
                                    </div>
                                </div>
                            )}

                            {/* PERP: 3 cards */}
                            {category === 'PERP' && (
                                <div className="grid-3">
                                    <div className="metric-card">
                                        <div className="metric-label">TVL Trend</div>
                                        <div className="metric-cell-value" style={{color: (current.tvl_7d_pct||0) >= 0 ? 'var(--accent-green)' : 'var(--accent-red)'}}>{current.tvl_7d_pct != null ? formatPercent(current.tvl_7d_pct) : <NaValue note="Insufficient TVL history" />}</div>
                                        <div className="metric-cell-sub">7D | 30D: {formatPercent(current.tvl_30d_pct)}</div>
                                    </div>
                                    <div className="metric-card">
                                        <div className="metric-label">Structural Dependence</div>
                                        <div className="metric-cell-value">{current.top_chain || <NaValue note="Chain breakdown not available" />}</div>
                                        <div className="metric-cell-sub">{current.top_chain_share_pct ? `${current.top_chain_share_pct.toFixed(1)}% share` : 'N/A'}
                                            <span style={{marginLeft:'8px',padding:'2px 6px',fontSize:'10px',background:'rgba(255,170,0,0.1)',color:'var(--accent-yellow)',border:'1px solid var(--accent-yellow)',letterSpacing:'0.5px'}}>STRUCTURAL</span>
                                        </div>
                                    </div>
                                    <div className="metric-card">
                                        <div className="metric-label">Data Coverage</div>
                                        <div className="metric-cell-value" style={{color: coverageColor(current.coverage_pct)}}>{current.coverage_pct !== null && current.coverage_pct !== undefined ? `${(current.coverage_pct * 100).toFixed(0)}%` : <NaValue note="Coverage data not computed" />}</div>
                                        <div className="metric-cell-sub">Pool count: {latestMetrics.pool_count_80 ?? 'N/A'} (structural)</div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Pools Tables (LENDING + DEX) */}
                        {(category === 'LENDING' || category === 'DEX') && pools.length > 0 && (() => {
                            const lendingPools = pools.filter(p => p.utilization !== null && p.utilization !== undefined);
                            const vaultPools = pools.filter(p => p.utilization === null || p.utilization === undefined);
                            return (<>
                                {/* Lending Markets (with borrow data) */}
                                {category === 'LENDING' && lendingPools.length > 0 && (
                                    <div className="panel">
                                        <div className="panel-header">
                                            <div className="panel-title">Lending Markets</div>
                                            <div className="panel-actions"><span style={{fontSize: '11px', color: 'var(--text-muted)'}}>{lendingPools.length} pools with borrow data</span></div>
                                        </div>
                                        <table className="data-table">
                                            <thead>
                                                <tr>
                                                    <th>Pool</th>
                                                    <th>Chain</th>
                                                    <th className="right">TVL</th>
                                                    <th className="right">Supply APY</th>
                                                    <th className="right">Borrow APY</th>
                                                    <th className="right">Utilization</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {lendingPools.map((pool, idx) => (
                                                    <tr key={idx}>
                                                        <td><div className="protocol-name">{pool.pool_name || pool.pool_id?.slice(0,20)}</div></td>
                                                        <td>{pool.chain || '-'}</td>
                                                        <td className="right">${formatTVL(pool.tvl_usd)}</td>
                                                        <td className="right" style={{color: 'var(--accent-green)'}}>{pool.supply_apy_total !== null && pool.supply_apy_total !== undefined ? `${pool.supply_apy_total.toFixed(2)}%` : '-'}</td>
                                                        <td className="right">{pool.borrow_apy_total !== null && pool.borrow_apy_total !== undefined ? `${pool.borrow_apy_total.toFixed(2)}%` : '-'}</td>
                                                        <td className="right">
                                                            <span style={{color: pool.utilization >= 0.9 ? 'var(--accent-red)' : pool.utilization >= 0.7 ? 'var(--accent-yellow)' : 'var(--accent-green)'}}>
                                                                {(pool.utilization * 100).toFixed(1)}%
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {/* Vaults / Yield Pools (no borrow data) */}
                                {category === 'LENDING' && vaultPools.length > 0 && (
                                    <div className="panel">
                                        <div className="panel-header">
                                            <div className="panel-title">Vaults / Yield Pools</div>
                                            <div className="panel-actions"><span style={{fontSize: '11px', color: 'var(--text-muted)'}}>{vaultPools.length} pools — no borrow market</span></div>
                                        </div>
                                        <table className="data-table">
                                            <thead>
                                                <tr>
                                                    <th>Pool</th>
                                                    <th>Chain</th>
                                                    <th className="right">TVL</th>
                                                    <th className="right">Supply APY</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {vaultPools.map((pool, idx) => (
                                                    <tr key={idx}>
                                                        <td><div className="protocol-name">{pool.pool_name || pool.pool_id?.slice(0,20)}</div></td>
                                                        <td>{pool.chain || '-'}</td>
                                                        <td className="right">${formatTVL(pool.tvl_usd)}</td>
                                                        <td className="right" style={{color: 'var(--accent-green)'}}>{pool.supply_apy_total !== null && pool.supply_apy_total !== undefined ? `${pool.supply_apy_total.toFixed(2)}%` : '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {/* DEX pools (no borrow columns) */}
                                {category === 'DEX' && (
                                    <div className="panel">
                                        <div className="panel-header">
                                            <div className="panel-title">Top Pools</div>
                                            <div className="panel-actions"><span style={{fontSize: '11px', color: 'var(--text-muted)'}}>{pools.length} pools</span></div>
                                        </div>
                                        <table className="data-table">
                                            <thead>
                                                <tr>
                                                    <th>Pool</th>
                                                    <th>Chain</th>
                                                    <th className="right">TVL</th>
                                                    <th className="right">Supply APY</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {pools.slice(0, 30).map((pool, idx) => (
                                                    <tr key={idx}>
                                                        <td><div className="protocol-name">{pool.pool_name || pool.pool_id?.slice(0,20)}</div></td>
                                                        <td>{pool.chain || '-'}</td>
                                                        <td className="right">${formatTVL(pool.tvl_usd)}</td>
                                                        <td className="right" style={{color: 'var(--accent-green)'}}>{pool.supply_apy_total !== null && pool.supply_apy_total !== undefined ? `${pool.supply_apy_total.toFixed(2)}%` : '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </>);
                        })()}

                        {/* Top Pools Concentration */}
                        {(() => {
                            const ps = detail?.pool_selection;
                            const t1 = ps?.top1_share_total;
                            const t5 = ps?.top5_share_total;
                            const t10 = ps?.top10_share_total;
                            const totalTvl = ps?.total_pool_tvl_usd;
                            const pc80 = ps?.pool_count_80;
                            const topChain = current?.top_chain_share_pct;
                            const hasData = t1 !== null && t1 !== undefined;
                            const tp = topPoolsData?.pools || [];
                            const tpTotal = topPoolsData?.total_pool_tvl || 0;

                            const BarRow = ({label, value, pools: barPools}) => {
                                const pct = value != null ? (value * 100) : 0;
                                const barColor = pct >= 80 ? 'var(--accent-red)' : pct >= 50 ? 'var(--accent-yellow)' : 'var(--accent-green)';
                                // Build tooltip text
                                const tipLines = barPools.map(p => `${(p.pool_name||'?').slice(0,25)}: $${formatTVL(p.tvl_usd)} (${(p.share*100).toFixed(1)}%)`);
                                const tip = `${label}: ${pct.toFixed(1)}%\nTotal pool TVL: $${formatTVL(tpTotal)}\n\n${tipLines.join('\n')}`;
                                return (
                                    <div style={{marginBottom: '12px'}} title={tip}>
                                        <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '4px'}}>
                                            <span style={{fontSize: '12px', color: 'var(--text-secondary)', fontFamily: 'IBM Plex Sans'}}>{label}</span>
                                            <span style={{fontSize: '12px', fontWeight: 600, color: barColor, fontFamily: 'JetBrains Mono'}}>{value != null ? `${pct.toFixed(1)}%` : 'N/A'}</span>
                                        </div>
                                        <div style={{height: '10px', background: 'var(--bg-primary)', borderRadius: '5px', overflow: 'hidden'}}>
                                            <div style={{width: `${Math.min(pct, 100)}%`, height: '100%', background: barColor, borderRadius: '5px', transition: 'width 0.5s ease'}}></div>
                                        </div>
                                    </div>
                                );
                            };

                            return (
                                <div className="panel">
                                    <div className="panel-header">
                                        <div className="panel-title">Top Pools Concentration</div>
                                        <div className="panel-actions" style={{display: 'flex', gap: '8px'}}>
                                            {pc80 != null && <span style={{fontSize: '11px', padding: '3px 8px', background: 'rgba(0,170,255,0.1)', color: '#00aaff', borderRadius: '3px', fontFamily: 'JetBrains Mono'}}>P80: {pc80} pools</span>}
                                            {topChain != null && <span style={{fontSize: '11px', padding: '3px 8px', background: 'rgba(170,0,255,0.1)', color: '#aa00ff', borderRadius: '3px', fontFamily: 'JetBrains Mono'}}>Chain: {topChain.toFixed(0)}%</span>}
                                        </div>
                                    </div>
                                    {hasData ? (
                                        <div style={{padding: '16px 20px'}}>
                                            <BarRow label="Top 1 Pool" value={t1} pools={tp.slice(0,1)} />
                                            <BarRow label="Top 5 Pools" value={t5} pools={tp.slice(0,5)} />
                                            <BarRow label="Top 10 Pools" value={t10} pools={tp.slice(0,10)} />
                                            <div style={{fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'JetBrains Mono', marginTop: '8px', borderTop: '1px solid var(--border-color)', paddingTop: '8px'}}>
                                                Computed from pool universe ({totalTvl ? `$${formatTVL(totalTvl)} total` : 'all pools'} for this protocol from yields pools endpoint). Hover bars for pool breakdown.
                                            </div>
                                        </div>
                                    ) : (
                                        <div style={{padding: '40px', textAlign: 'center', color: 'var(--text-muted)', fontSize: '13px'}}>No pool data</div>
                                    )}
                                </div>
                            );
                        })()}

                        {/* Active Alerts with Risk Flags — grouped by alert_type */}
                        {detail?.alerts && detail.alerts.length > 0 && (() => {
                            // Group alerts by alert_type, keep latest first
                            const grouped = {};
                            detail.alerts.forEach(a => {
                                if (!grouped[a.alert_type]) grouped[a.alert_type] = [];
                                grouped[a.alert_type].push(a);
                            });
                            const groups = Object.entries(grouped).map(([type, items]) => ({
                                type,
                                latest: items[0],
                                count: items.length,
                                history: items.slice(1)
                            })).sort((a, b) => (b.latest.points||0) - (a.latest.points||0));

                            return (
                                <div className="panel">
                                    <div className="panel-header">
                                        <div className="panel-title">Active Risk Alerts (14D)</div>
                                        <div className="panel-actions"><span style={{fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'JetBrains Mono'}}>{detail.alerts.length} occurrence{detail.alerts.length !== 1 ? 's' : ''} across {groups.length} alert type{groups.length !== 1 ? 's' : ''}</span></div>
                                    </div>
                                    <div style={{display: 'grid', gap: '12px'}}>
                                        {groups.map((g, gi) => (
                                            <AlertGroup key={gi} group={g} />
                                        ))}
                                    </div>
                                </div>
                            );
                        })()}

                        {/* Risk Score Breakdown */}
                        {latestMetrics.risk_flags && Object.keys(latestMetrics.risk_flags).length > 0 && (
                            <div className="panel">
                                <div className="panel-header">
                                    <div className="panel-title">Risk Score Attribution</div>
                                    <div className="panel-actions"><span style={{fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'JetBrains Mono'}}>{latestMetrics.date || 'latest'}</span></div>
                                </div>
                                <div className="risk-calc">
                                    {Object.entries(latestMetrics.risk_flags)
                                        .filter(([k, v]) => !k.startsWith('_') && v.points > 0)
                                        .sort((a, b) => (b[1].points||0) - (a[1].points||0))
                                        .map(([flag, info]) => (
                                        <div className="calc-line" key={flag}>
                                            <span className="calc-condition">{flag} ({(info.severity||'').toUpperCase()})</span>
                                            <span className="calc-value">+{info.points} pts</span>
                                        </div>
                                    ))}
                                    {/* Show 0-point info flags */}
                                    {Object.entries(latestMetrics.risk_flags)
                                        .filter(([k, v]) => !k.startsWith('_') && v.points === 0)
                                        .map(([flag, info]) => (
                                        <div className="calc-line" key={flag} style={{opacity: 0.5}}>
                                            <span className="calc-condition">{flag} (INFO)</span>
                                            <span className="calc-value" style={{color: 'var(--text-muted)'}}>0 pts</span>
                                        </div>
                                    ))}
                                    {/* Show guardrail adjustments */}
                                    {latestMetrics.risk_flags._METRIC_COVERAGE_GUARDRAIL?.applied && (
                                        <div className="calc-line" style={{borderTop: '1px dashed var(--border-color)', marginTop: '8px', paddingTop: '8px'}}>
                                            <span className="calc-condition" style={{color: 'var(--accent-yellow)'}}>Metric Coverage Guardrail (×0.7 lending pts)</span>
                                            <span className="calc-value" style={{color: 'var(--accent-yellow)'}}>Util coverage {((latestMetrics.risk_flags._METRIC_COVERAGE_GUARDRAIL.metric_coverage_util||0)*100).toFixed(0)}% &lt; 50%</span>
                                        </div>
                                    )}
                                    {latestMetrics.risk_flags._COVERAGE_GUARDRAIL?.applied && (
                                        <div className="calc-line" style={{borderTop: '1px dashed var(--border-color)', marginTop: '8px', paddingTop: '8px'}}>
                                            <span className="calc-condition" style={{color: 'var(--accent-yellow)'}}>Low Coverage Guardrail (×0.7 lending pts)</span>
                                            <span className="calc-value" style={{color: 'var(--accent-yellow)'}}>Coverage {((latestMetrics.risk_flags._COVERAGE_GUARDRAIL.coverage_pct||0)*100).toFixed(0)}% &lt; 50%</span>
                                        </div>
                                    )}
                                    <div className="calc-line">
                                        <span className="calc-condition">Total Risk Score</span>
                                        <span className="calc-value">{current.risk_score ?? 0}</span>
                                    </div>
                                </div>
                            </div>
                        )}
                    </>)}
                </div>
            );
        };

        const DailyBriefPage = () => {
            const [brief, setBrief] = useState(null);
            const [loading, setLoading] = useState(true);
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);

            const initialLoad = useRef(true);
            useEffect(() => {
                if (initialLoad.current) {
                    initialLoad.current = false;
                    fetchBrief('__latest__');
                } else {
                    fetchBrief();
                }
            }, [selectedDate]);

            const fetchBrief = async (dateOverride) => {
                setLoading(true);
                try {
                    const useDate = dateOverride || selectedDate;
                    const url = dateOverride === '__latest__'
                        ? `${API_BASE}/daily-brief`
                        : `${API_BASE}/daily-brief?date=${useDate}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    setBrief(data);
                    if (data.date && data.date !== selectedDate) {
                        setSelectedDate(data.date);
                    }
                } catch (err) {
                    console.error('Error:', err);
                } finally {
                    setLoading(false);
                }
            };

            const exportMarkdown = async () => {
                if (!brief) return;

                let overviewData = [];
                try {
                    const res = await fetch(`${API_BASE}/overview`);
                    overviewData = await res.json();
                } catch (e) { /* proceed without */ }

                let md = `# Protocol Health Monitor — Daily Risk Brief\n\n`;
                md += `**Date:** ${brief.date}  \n`;
                md += `**Generated:** ${new Date().toISOString().slice(0,16).replace('T',' ')}  \n\n`;

                if (overviewData.length > 0) {
                    md += `## Monitored Protocols\n\n`;
                    md += `| Protocol | Category | TVL | Risk Score |\n`;
                    md += `|----------|----------|-----|------------|\n`;
                    overviewData.sort((a,b) => (b.tvl_usd||0) - (a.tvl_usd||0)).forEach(p => {
                        const tvl = p.tvl_usd ? `$${(p.tvl_usd/1e9).toFixed(2)}B` : 'N/A';
                        md += `| ${p.name} | ${p.category} | ${tvl} | ${p.risk_score ?? 'N/A'} |\n`;
                    });
                    md += `\n`;
                }

                md += `## Alert Summary\n\n`;
                md += `| Metric | Count |\n`;
                md += `|--------|-------|\n`;
                md += `| Total Alerts | ${brief.summary?.total_alerts || 0} |\n`;
                md += `| Protocols Affected | ${brief.summary?.protocols_with_alerts || 0} |\n`;
                md += `| Critical | ${brief.summary?.crit_count || 0} |\n`;
                md += `| High | ${brief.summary?.high_count || 0} |\n`;
                md += `| Medium | ${brief.summary?.med_count || 0} |\n`;
                md += `| Low | ${brief.summary?.low_count || 0} |\n\n`;

                const activeAlerts = (brief.alerts || []).filter(a => a.points > 0);
                const infoFlags = (brief.alerts || []).filter(a => a.points === 0);

                if (activeAlerts.length > 0) {
                    md += `## Active Alerts\n\n`;
                    activeAlerts.forEach((alert, i) => {
                        const sev = (alert.severity || '').toUpperCase();
                        md += `### ${i + 1}. ${alert.protocol_name} — ${alert.alert_type} [${sev}] (+${alert.points}pts)\n\n`;
                        md += `- **Category:** ${alert.category}\n`;
                        md += `- **Message:** ${alert.message}\n\n`;
                    });
                }

                md += `## Data Quality\n\n`;
                if (overviewData.length > 0) {
                    const lowCov = overviewData.filter(p => p.coverage_pct !== null && p.coverage_pct < 0.5);
                    const avgCov = overviewData.filter(p => p.coverage_pct != null);
                    const avgCovPct = avgCov.length > 0 ? (avgCov.reduce((s,p) => s + p.coverage_pct, 0) / avgCov.length * 100).toFixed(0) : 'N/A';
                    md += `- **Average Coverage:** ${avgCovPct}%\n`;
                    if (lowCov.length > 0) {
                        md += `- **Low Coverage (< 50%):** ${lowCov.map(p => p.name).join(', ')}\n`;
                    } else {
                        md += `- **Low Coverage:** None\n`;
                    }
                }
                if (infoFlags.length > 0) {
                    md += `- **Data Incomplete Flags:**\n`;
                    infoFlags.forEach(f => {
                        md += `  - ${f.protocol_name}: ${f.alert_type} — ${f.message}\n`;
                    });
                } else {
                    md += `- **Data Incomplete Flags:** None\n`;
                }
                md += `\n---\n*Generated by Protocol Health Monitor*\n`;

                const blob = new Blob([md], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `risk-brief-${brief.date}.md`;
                a.click();
            };

            if (loading || !brief) {
                return (<div className="loading-container"><div className="spinner"></div><div>Loading daily brief...</div></div>);
            }

            const s = brief.summary || {};

            return (
                <div className="container">
                    {/* Top Tiles */}
                    <div className="grid-5">
                        <div className="metric-card">
                            <div className="metric-label">Total Alerts</div>
                            <div className="metric-value">{s.total_alerts || 0}</div>
                            <div className="metric-change change-neutral"><span style={{color: 'var(--text-muted)'}}>{s.protocols_with_alerts || 0} protocols</span></div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Critical</div>
                            <div className="metric-value" style={{color: 'var(--accent-crit)'}}>{s.crit_count || 0}</div>
                            <div className="metric-change change-negative">Immediate action</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">High Severity</div>
                            <div className="metric-value" style={{color: 'var(--accent-red)'}}>{s.high_count || 0}</div>
                            <div className="metric-change change-negative">Attention needed</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Medium</div>
                            <div className="metric-value" style={{color: 'var(--accent-yellow)'}}>{s.med_count || 0}</div>
                            <div className="metric-change change-neutral">Monitor</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Coverage Issues</div>
                            <div className="metric-value">{s.coverage_issues || 0}</div>
                            <div className="metric-change change-neutral"><span style={{color: 'var(--text-muted)'}}>LOW_COVERAGE + DATA_GAP</span></div>
                        </div>
                    </div>

                    {/* Alert Details Table */}
                    <div className="panel">
                        <div className="panel-header">
                            <div className="panel-title">Alert Details - {selectedDate}</div>
                            <div className="panel-actions">
                                <input type="date" className="btn" style={{padding: '6px 12px'}} value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} />
                                <button className="btn" onClick={exportMarkdown}>Export MD</button>
                            </div>
                        </div>

                        {brief.alerts.length === 0 ? (
                            <div style={{padding: '60px', textAlign: 'center'}}>
                                <div style={{fontSize: '48px', marginBottom: '16px'}}>OK</div>
                                <div style={{fontSize: '18px', color: 'var(--accent-green)', marginBottom: '8px'}}>No Alerts</div>
                                <div style={{fontSize: '13px', color: 'var(--text-secondary)'}}>All protocols operating within normal parameters</div>
                            </div>
                        ) : (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th style={{width: '40px'}}>#</th>
                                        <th>Protocol</th>
                                        <th>Category</th>
                                        <th>Alert Type</th>
                                        <th className="center">Severity</th>
                                        <th className="right">Points</th>
                                        <th>Message</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {brief.alerts.map((alert, idx) => (
                                        <tr key={idx}>
                                            <td style={{color: 'var(--text-muted)', fontWeight: 700}}>{idx + 1}</td>
                                            <td><div className="protocol-name">{alert.protocol_name}</div></td>
                                            <td><span className={`category-badge ${getCategoryClass(alert.category)}`}>{(alert.category||'').toUpperCase()}</span></td>
                                            <td style={{fontFamily: 'JetBrains Mono', fontSize: '11px'}}>{alert.alert_type}</td>
                                            <td className="center">
                                                <span className={`risk-score ${getSeverityClass(alert.severity)}`} style={{fontSize: '11px', padding: '4px 8px'}}>
                                                    {(alert.severity||'').toUpperCase()}
                                                </span>
                                            </td>
                                            <td className="right" style={{fontFamily: 'JetBrains Mono'}}>+{alert.points || 0}</td>
                                            <td style={{fontFamily: 'IBM Plex Sans', fontSize: '13px'}}>{alert.message}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('overview');

            return (
                <div style={{minHeight: '100vh', background: 'var(--bg-primary)'}}>
                    <div className="header">
                        <div className="header-content">
                            <div className="header-left">
                                <div className="title">Protocol Health Monitor</div>
                                <div className="live-indicator">
                                    <span className="live-dot"></span>
                                    <span>LIVE</span>
                                </div>
                            </div>
                            <div className="nav">
                                <a className={currentPage === 'overview' ? 'active' : ''} onClick={() => setCurrentPage('overview')}>Overview</a>
                                <a className={currentPage === 'detail' ? 'active' : ''} onClick={() => setCurrentPage('detail')}>Analytics</a>
                                <a className={currentPage === 'brief' ? 'active' : ''} onClick={() => setCurrentPage('brief')}>Risk Brief</a>
                            </div>
                        </div>
                    </div>
                    {currentPage === 'overview' && <OverviewPage />}
                    {currentPage === 'detail' && <ProtocolDetailPage />}
                    {currentPage === 'brief' && <DailyBriefPage />}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
